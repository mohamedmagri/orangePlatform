# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - orangeForecasting

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: 'ubuntu-latest'

    steps:
    - uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to registry
      uses: docker/login-action@v2
      with:
        registry: https://orangeapp.azurecr.io/
        username: ${{ secrets.AzureAppService_ContainerUsername_22987b60d9144216b42d4d942f5cc7f1 }}
        password: ${{ secrets.AzureAppService_ContainerPassword_d44ccb833f234404b506daad103a5cea }}

    - name: Build and push container image to registry
      uses: docker/build-push-action@v3
      with:
        push: true
        tags: orangeapp.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_22987b60d9144216b42d4d942f5cc7f1 }}/orange:${{ github.sha }}
        file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'orangeForecasting'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_7b3c158996a64c31adbdb9c3c3042b72 }}
        images: 'orangeapp.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_22987b60d9144216b42d4d942f5cc7f1 }}/orange:${{ github.sha }}'